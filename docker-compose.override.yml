version: '3.8'

services:
  # Disable postgres - use existing certen-postgres
  postgres:
    image: alpine:latest
    container_name: certen-proofs-db-dummy
    entrypoint: ['sleep', 'infinity']
    healthcheck:
      test: ['CMD', 'true']
      interval: 5s
      timeout: 2s
      retries: 1
    networks:
      - certen-validators_certen-net

  proof-service:
    environment:
      DATABASE_URL: ${PROOFS_DATABASE_URL}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,https://certen-web.web.app,https://certen-web.firebaseapp.com"
      PROOFS_SERVICE_TOKEN_SECRET_V1: ${PROOFS_SERVICE_TOKEN_SECRET_V1:-}
    networks:
      - certen-validators_certen-net

  # Disable explorer - integrated into certen-web-app
  proof-explorer:
    profiles:
      - disabled

networks:
  certen-validators_certen-net:
    external: true
